{% extends "base.html" %}
{% block title %}编辑足迹 - {{ site_name }}{% endblock %}
{% block content %}
<div class="page-narrow">
    <a href="{{ url_for('footprint_detail', fid=fp.id) }}" style="display:inline-flex;align-items:center;gap:6px;font-size:13px;color:var(--text-muted);margin-bottom:16px">
        <i data-lucide="arrow-left" style="width:14px;height:14px"></i> 返回
    </a>

    <h1 class="page-title"><i data-lucide="map-pin"></i> 编辑足迹</h1>

    <div class="admin-section">
        <form action="{{ url_for('footprint_edit', fid=fp.id) }}" method="POST" enctype="multipart/form-data">
            <div class="form-group">
                <label>照片</label>
                {% if fp.image_url %}
                <div style="margin-bottom:8px">
                    <img src="{{ fp.image_url }}" alt="当前照片" style="max-height:200px;border-radius:8px">
                </div>
                {% endif %}
                <div class="upload-area" onclick="document.getElementById('image').click()">
                    <span id="upload-label">{% if fp.image_url %}点击更换图片{% else %}点击选择图片{% endif %}</span>
                    <input type="file" id="image" name="image" accept="image/*" style="display:none" onchange="document.getElementById('upload-label').textContent = this.files[0] ? this.files[0].name : '{% if fp.image_url %}点击更换图片{% else %}点击选择图片{% endif %}'">
                </div>
                <input type="hidden" name="image_url" value="{{ fp.image_url or '' }}">
            </div>

            <div class="form-group">
                <label for="location">地点</label>
                <input type="text" id="location" name="location" value="{{ fp.location or '' }}" placeholder="例如：颐和园" required>
            </div>

            <div class="form-group">
                <label for="description">描述</label>
                <textarea id="description" name="description" rows="4" placeholder="记录此刻的感受…" required>{{ fp.description or '' }}</textarea>
            </div>

            <div class="form-group">
                <label for="date">日期</label>
                <input type="date" id="date" name="date" value="{{ fp.date }}" required>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary"><i data-lucide="save" style="width:14px;height:14px"></i> 保存</button>
                <a href="{{ url_for('footprint_detail', fid=fp.id) }}" class="btn"><i data-lucide="x" style="width:14px;height:14px"></i> 取消</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
